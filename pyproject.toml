[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-assistant"
version = "0.1.0"
description = "Offline AI meeting assistant: user-guided anchors, verified summaries, follow-ups and tasks."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.0"]
app = ["PySide6>=6.6"]
dev = ["pytest>=8"]

[project.scripts]
meeting-assistant = "meeting_assistant.cli:main"

[project.gui-scripts]
meeting-assistant-app = "meeting_assistant.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
